name: main

on:
  workflow_dispatch:
    inputs:
      skip-version-check:
        type: boolean
        description: Skip version check
        required: false
  schedule:
    - cron: "0 0 1 * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Check if the latest version of FFmpeg in vcpkg is newer than the latest release
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          repository: microsoft/vcpkg
          ref: master

      - name: Get latest FFmpeg package
        id: latest-ffmpeg
        run: echo "version=$(cat ports/ffmpeg/vcpkg.json | jq -r '.version')" >> $GITHUB_OUTPUT

      - name: Get latest release
        id: latest-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "version=$(gh release view --json tagName --jq .tagName --repo ${{ github.event.repository.full_name }} 2>/dev/null || echo none)" >> $GITHUB_OUTPUT

    outputs:
      version: ${{ steps.latest-ffmpeg.outputs.version }}
      stale: ${{ inputs.skip-version-check || steps.latest-ffmpeg.outputs.version != steps.latest-release.outputs.version }}

  # Build FFmpeg for all supported platforms.
  # macOS legs first; extend the matrix with windows/linux/android
  # legs (same shape) when those platforms are needed.
  pack:
    needs: version

    # Job outputs are passed as strings, so we need to convert the value to an actual boolean
    if: ${{ fromJson(needs.version.outputs.stale) }}

    strategy:
      fail-fast: false
      matrix:
        target-os:
          - osx
          - linux
          - windows
          - android
        target-arch:
          - arm64
          - x64
        include:
          # Determine the runner OS based on the target OS
          - target-os: osx
            os: macos-latest
          - target-os: linux
            os: ubuntu-latest
          - target-os: windows
            os: windows-latest
          - target-os: android
            os: ubuntu-latest
        exclude:
          # linux/arm64 needs a cross toolchain (runner is x64); enable
          # when cross-build is configured. Other future excludes:
          # windows+arm, linux+arm, osx+arm, osx+x86.
          - target-os: linux
            target-arch: arm64
          # windows/arm64 needs a cross toolchain (runner is x64).
          - target-os: windows
            target-arch: arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout self
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          path: self/

      - name: Checkout vcpkg
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          repository: microsoft/vcpkg
          ref: master
          path: vcpkg/

      - name: Bootstrap vcpkg
        run: ${{ runner.os == 'Windows' && 'vcpkg/bootstrap-vcpkg.bat' || 'vcpkg/bootstrap-vcpkg.sh' }}

      - name: Install dependencies
        run: ${{ runner.os == 'Windows' && 'self/install-deps.ps1' || 'self/install-deps.sh' }}

      - name: Setup Android NDK
        if: ${{ matrix.target-os == 'android' }}
        run: |
          NDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}/ndk"
          if [ ! -d "${ANDROID_NDK_HOME:-x}" ]; then
            if [ -d "$NDK_ROOT" ] && [ -n "$(ls -A "$NDK_ROOT")" ]; then
              echo "ANDROID_NDK_HOME=$NDK_ROOT/$(ls "$NDK_ROOT" | sort -V | tail -1)" >> $GITHUB_ENV
            else
              SDM="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
              yes | "$SDM" --licenses > /dev/null
              NDK_PKG="$("$SDM" --list 2>/dev/null | grep -oE 'ndk;[0-9.]+' | sort -Vu -t';' -k2 | tail -1)"
              "$SDM" "$NDK_PKG"
              echo "ANDROID_NDK_HOME=$NDK_ROOT/${NDK_PKG#ndk;}" >> $GITHUB_ENV
            fi
          fi

      - name: Build FFmpeg
        run: >
          vcpkg/vcpkg install
          --recurse
          --triplet ${{ matrix.target-arch }}-${{ matrix.target-os }}
          --x-manifest-root self/

      - name: Verify capabilities (Windows)
        if: ${{ runner.os == 'Windows' && matrix.target-os != 'android' }}
        shell: pwsh
        run: ./self/scripts/verify-capabilities.ps1 -FFmpegPath ./self/vcpkg_installed/${{ matrix.target-arch }}-${{ matrix.target-os }}/tools/ffmpeg/ffmpeg.exe

      - name: Verify capabilities (Unix)
        if: ${{ runner.os != 'Windows' && matrix.target-os != 'android' }}
        run: ./self/scripts/verify-capabilities.sh ./self/vcpkg_installed/${{ matrix.target-arch }}-${{ matrix.target-os }}/tools/ffmpeg/ffmpeg

      - name: Upload build logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        # Disabled: sometimes globbing fails on some of the produced directories
        if: ${{ false }} # ${{ !cancelled() }}
        with:
          name: logs-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: vcpkg/buildtrees/**/*.log
          if-no-files-found: ignore

      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 7.0.2
        with:
          name: ffmpeg-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: self/vcpkg_installed/${{ matrix.target-arch }}-${{ matrix.target-os }}/tools/ffmpeg/
          if-no-files-found: error

  # Create a new release with the tag matching the FFmpeg version
  release:
    needs:
      - version
      - pack

    # Only release when running on main
    if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release view ${{ needs.version.outputs.version }}
          --repo ${{ github.event.repository.full_name }} > /dev/null 2>&1 ||
          gh release create ${{ needs.version.outputs.version }}
          --title ${{ needs.version.outputs.version }}
          --notes "Built on $(date +'%Y-%m-%d')"
          --repo ${{ github.event.repository.full_name }}

  # Upload the built artifacts to the release
  deploy:
    needs:
      - version
      - release

    strategy:
      matrix:
        target-os:
          - osx
          - linux
          - windows
          - android
        target-arch:
          - arm64
          - x64
          # Future: arm, x86 (android and legacy legs)
        exclude:
          # Matches pack: linux/arm64 has no cross toolchain yet.
          - target-os: linux
            target-arch: arm64
          # Matches pack: windows/arm64 has no cross toolchain yet.
          - target-os: windows
            target-arch: arm64

    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download build output
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # 8.0.2
        with:
          name: ffmpeg-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: ffmpeg/

      - name: Set permissions
        if: ${{ matrix.target-os != 'windows' }}
        run: |
          chmod +x ffmpeg/ffmpeg
          [ -f ffmpeg/ffplay ] && chmod +x ffmpeg/ffplay || true
          [ -f ffmpeg/ffprobe ] && chmod +x ffmpeg/ffprobe || true

      - name: Create package
        # Change into the artifacts directory to avoid including the directory itself in the zip archive
        working-directory: ffmpeg/
        run: zip -r ../ffmpeg-${{ matrix.target-os }}-${{ matrix.target-arch }}.zip .

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release upload ${{ needs.version.outputs.version }}
          ffmpeg-${{ matrix.target-os }}-${{ matrix.target-arch }}.zip
          --clobber
          --repo ${{ github.event.repository.full_name }}
